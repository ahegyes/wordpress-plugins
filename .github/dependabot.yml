version: 2
updates:
  # The mirrors are read-only, so the plugins' dependencies and workflow pins are updated here.
  - package-ecosystem: composer
    directories:
      - /
      - /plugins/*
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: UTC
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      php-dev-deps:
        patterns:
          - '*'
        dependency-type: development

  - package-ecosystem: npm
    directories:
      - /
      - /plugins/*
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: UTC
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      npm-dev-deps:
        patterns:
          - '*'
        dependency-type: development

  - package-ecosystem: github-actions
    # Dependabot reads .github/workflows only for the root; any other directory is scanned for its own workflow files.
    directories:
      - /
      - /plugins/*/.github/workflows
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: UTC
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'
