name: Quality

on:
  push:
    branches: [trunk]
  pull_request:

permissions:
  contents: read

jobs:
  plugins:
    name: Plugins
    uses: ./.github/workflows/plugins.yml

  lint-php:
    name: Lint PHP (${{ matrix.plugin }})
    needs: plugins
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.plugins.outputs.plugins) }}
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-php-lint.yml@b107001cce9f2960495d9d50481c8540d228f60c
    with:
      project-path: plugins/${{ matrix.plugin }}
      php-version: '8.5'
      scripts: '["lint:php:phpcs", "lint:php:phpcs:tests", "lint:php:phpstan", "changelog:validate"]'

  lint-scripts-styles:
    name: Lint scripts and styles (${{ matrix.project }})
    needs: plugins
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.plugins.outputs.projects) }}
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-scripts-styles-lint.yml@b107001cce9f2960495d9d50481c8540d228f60c
    with:
      project-path: ${{ matrix.project }}
      # The root holds only the shared environment's spec and configs, so it has no styles to lint.
      scripts: ${{ matrix.project == '.' && '["lint:scripts", "lint:types"]' || '["lint:scripts", "lint:styles", "lint:types"]' }}

  block-json:
    name: block.json schema (${{ matrix.plugin }})
    needs: plugins
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.plugins.outputs.plugins) }}
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-block-json-check.yml@b107001cce9f2960495d9d50481c8540d228f60c
    with:
      project-path: plugins/${{ matrix.plugin }}

  php-syntax:
    name: PHP syntax (${{ matrix.plugin }})
    needs: plugins
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.plugins.outputs.plugins) }}
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-php-syntax-check.yml@b107001cce9f2960495d9d50481c8540d228f60c
    with:
      project-path: plugins/${{ matrix.plugin }}
      php-versions: '["7.4"]'
      paths: ${{ format('["{0}.php", "uninstall.php", "includes"]', matrix.plugin) }}

  readme-lint:
    name: readme.txt lint (${{ matrix.plugin }})
    needs: plugins
    if: needs.plugins.outputs.readmes != '[]'
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.plugins.outputs.readmes) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: thetwopct/wporg-plugin-readme-linter@1f869aba959265ecc90935b2380c6569d56646ac # v1.0.2
        with:
          path: plugins/${{ matrix.plugin }}/readme.txt
          fail-on: error
