name: Release Rehearsal

# The mirrors take no pull requests, so each plugin's own release workflow first runs on its tag; this builds, checks and tests every plugin's release here without publishing it.
on:
  push:
    branches: [trunk]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plugins:
    name: Plugins
    uses: ./.github/workflows/plugins.yml

  release:
    name: Release (${{ matrix.plugin }})
    needs: plugins
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.plugins.outputs.plugins) }}
    # A reusable workflow cannot raise the caller's token, so this job grants every scope the release's jobs declare.
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-release.yml@b107001cce9f2960495d9d50481c8540d228f60c
    with:
      project-path: plugins/${{ matrix.plugin }}
      plugin-slug: ${{ matrix.plugin }}
      wp-env-config-file: '.wp-env.tests.json'
      # Both parse every PHP file with php-parser 4, which stops at PHP 8.4 syntax such as protected(set).
      exclude-checks: 'prefixing,direct_file_access'
      wp-org: ${{ contains(fromJSON(needs.plugins.outputs.readmes), matrix.plugin) }}
      publish: false
