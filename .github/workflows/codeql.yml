name: CodeQL

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analyze:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-codeql.yml@67dfdca82b80b511dc4dfe561b98a053a2226d1d
    with:
      languages: '["actions", "javascript-typescript"]'
