name: Plugins

# Every directory under plugins/ is a plugin whose main file and mirror its own files name, so a new plugin joins every lane without an edit to the workflows that call this one.
on:
  workflow_call:
    inputs:
      list-wordpress:
        description: 'Whether to list each plugin''s WordPress versions, which only the Tests workflow reads.'
        type: boolean
        required: false
        default: false
    outputs:
      plugins:
        description: 'JSON array of the plugin directories under plugins/, each named after its slug.'
        value: ${{ jobs.list.outputs.plugins }}
      projects:
        description: 'JSON array of the Composer projects: the repository root, then each plugin directory.'
        value: ${{ jobs.list.outputs.projects }}
      readmes:
        description: 'JSON array of the plugin directories that hold a readme.txt, which wordpress.org distribution needs.'
        value: ${{ jobs.list.outputs.readmes }}
      mirrors:
        description: 'JSON array of { plugin, repo } objects, the mirror each plugin splits to, as its composer.json name gives it.'
        value: ${{ jobs.list.outputs.mirrors }}
      wordpress:
        description: 'JSON array of { plugin, wp } objects: the newest WordPress release of every branch from each plugin''s Requires at least up. Empty unless list-wordpress is true.'
        value: ${{ jobs.wordpress.outputs.wordpress }}

permissions:
  contents: read

jobs:
  list:
    name: List the plugins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plugins: ${{ steps.plugins.outputs.plugins }}
      projects: ${{ steps.plugins.outputs.projects }}
      readmes: ${{ steps.plugins.outputs.readmes }}
      mirrors: ${{ steps.plugins.outputs.mirrors }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: List the plugin directories
        id: plugins
        run: |
          plugins=$(find plugins -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | jq -Rsc 'split("\n") | map(select(length > 0)) | if length == 0 then error("plugins/ holds no plugin.") else . end')
          mirrors='[]'
          readmes='[]'
          for plugin in $(jq -r '.[]' <<< "$plugins"); do
            if ! [[ "$plugin" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || [ ! -f "plugins/$plugin/$plugin.php" ]; then
              echo "::error::plugins/$plugin must be a kebab-case slug holding its main file, $plugin.php."
              exit 1
            fi
            domain=$(jq -r '.extra["text-domain"] // empty' "plugins/$plugin/composer.json")
            if [ "$domain" != "$plugin" ]; then
              echo "::error::plugins/$plugin/composer.json's extra.text-domain must be its directory's name, $plugin — got '$domain'."
              exit 1
            fi
            repo=$(jq -r '.name // empty' "plugins/$plugin/composer.json")
            if ! [[ "$repo" =~ ^ahegyes/[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
              echo "::error::plugins/$plugin/composer.json's name must be its mirror, ahegyes/<repository> — got '$repo'."
              exit 1
            fi
            mirrors=$(jq -c --arg plugin "$plugin" --arg repo "${repo#ahegyes/}" '. + [{ plugin: $plugin, repo: $repo }]' <<< "$mirrors")
            if [ -f "plugins/$plugin/readme.txt" ]; then
              readmes=$(jq -c --arg plugin "$plugin" '. + [$plugin]' <<< "$readmes")
            fi
          done
          # A release tag names the plugin it releases, so a tag naming no plugin would otherwise split nothing and pass.
          if [ "$GITHUB_REF_TYPE" = 'tag' ] && ! jq -e --arg plugin "${GITHUB_REF_NAME%%/*}" 'index($plugin) != null' <<< "$plugins" > /dev/null; then
            echo "::error::The tag $GITHUB_REF_NAME names no plugin under plugins/; a release tag reads <slug>/vX.Y.Z."
            exit 1
          fi
          {
            echo "plugins=$plugins"
            echo "projects=$(jq -c '["."] + map("plugins/" + .)' <<< "$plugins")"
            echo "readmes=$readmes"
            echo "mirrors=$mirrors"
          } >> "$GITHUB_OUTPUT"

  # Only the Tests workflow reads the versions, so a failure reaching WordPress's version API holds back no split or other lane.
  wordpress:
    name: List the WordPress versions
    needs: list
    if: inputs.list-wordpress
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      wordpress: ${{ steps.wordpress.outputs.wordpress }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # WordPress's version API offers the newest release of every branch, so new releases and raised floors join without an edit here.
      - name: List the newest WordPress release of every branch from each plugin's floor up
        id: wordpress
        env:
          PLUGINS: ${{ needs.list.outputs.plugins }}
        run: |
          offers=$(curl -fsS --retry 3 --retry-all-errors --max-time 20 https://api.wordpress.org/core/version-check/1.7/)
          pairs='[]'
          for plugin in $(jq -r '.[]' <<< "$PLUGINS"); do
            floor=$(sed -nE 's|^[[:space:]/*#@]*Requires at least:[[:space:]]*([0-9]+(\.[0-9]+)*).*$|\1|p' "plugins/$plugin/$plugin.php" | head -n 1)
            if [ -z "$floor" ]; then
              echo "::error::plugins/$plugin/$plugin.php declares no Requires at least header."
              exit 1
            fi
            pairs=$(printf '%s' "$offers" | jq -c --arg floor "$floor" --arg plugin "$plugin" --argjson pairs "$pairs" '[.offers[].version | select((split(".")[0:2] | map(tonumber)) >= ($floor | split(".")[0:2] | map(tonumber)))] | unique | if length == 0 then error("No WordPress release at or above \($floor) for \($plugin).") else $pairs + map({ plugin: $plugin, wp: . }) end')
          done
          echo "wordpress=$pairs" >> "$GITHUB_OUTPUT"
