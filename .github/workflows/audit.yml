name: Supply-Chain Audit

on:
  push:
    branches: [trunk]
  pull_request:
  schedule:
    # Weekly, so advisories published against an unchanged lock surface without a push.
    - cron: '0 7 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plugins:
    name: Plugins
    uses: ./.github/workflows/plugins.yml

  audit:
    name: Audit (${{ matrix.project }})
    needs: plugins
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.plugins.outputs.projects) }}
    # Only production npm packages gate the audit, since a release ships none of the development tooling.
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-supply-chain-audit.yml@67dfdca82b80b511dc4dfe561b98a053a2226d1d
    with:
      project-path: ${{ matrix.project }}
