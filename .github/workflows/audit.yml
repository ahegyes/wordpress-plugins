name: Supply-Chain Audit

on:
  push:
    branches: [trunk]
  pull_request:
  schedule:
    # Weekly Monday at 07:00 UTC — staggered after dependabot (06:00) so PRs from
    # dependency bumps surface audit results in the same morning batch.
    - cron: '0 7 * * 1'

permissions:
  contents: read

jobs:
  plugins:
    name: Plugins
    uses: ./.github/workflows/plugins.yml

  audit:
    name: Audit (${{ matrix.project }})
    needs: plugins
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.plugins.outputs.projects) }}
    # npm gate audits production deps only — the dev-tooling graph (wp-scripts/playwright trees) is advisory via dependabot alerts.
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-supply-chain-audit.yml@b107001cce9f2960495d9d50481c8540d228f60c
    with:
      project-path: ${{ matrix.project }}
      npm-audit-flags: '--omit=dev --audit-level=high'
