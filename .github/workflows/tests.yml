name: Tests

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugins:
    name: Plugins
    uses: ./.github/workflows/plugins.yml
    with:
      list-wordpress: true

  unit:
    name: Unit (${{ matrix.plugin }})
    needs: plugins
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.plugins.outputs.plugins) }}
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-phpunit.yml@b107001cce9f2960495d9d50481c8540d228f60c
    with:
      project-path: plugins/${{ matrix.plugin }}
      php-version: '8.5'
      composer-script: 'test:unit'
      needs-wp-env: false

  integration:
    name: Integration (${{ matrix.plugin }}, WordPress ${{ matrix.wp }})
    needs: plugins
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plugins.outputs.wordpress) }}
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-phpunit.yml@b107001cce9f2960495d9d50481c8540d228f60c
    with:
      project-path: plugins/${{ matrix.plugin }}
      php-version: '8.5'
      wp-version: ${{ matrix.wp }}
      composer-script: 'test:integration:run'
      wp-env-config-file: '.wp-env.tests.json'

  e2e:
    name: E2E (${{ matrix.plugin }}, WordPress ${{ matrix.wp }})
    needs: plugins
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plugins.outputs.wordpress) }}
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-playwright-e2e.yml@b107001cce9f2960495d9d50481c8540d228f60c
    with:
      project-path: plugins/${{ matrix.plugin }}
      artifact-slug: ${{ matrix.plugin }}-wp-${{ matrix.wp }}
      php-version: '8.5'
      wp-version: ${{ matrix.wp }}
      wp-env-config-file: '.wp-env.tests.json'

  # CI installs only the root, so the shared environment's jobs install and build the plugins it maps.
  shared-integration:
    name: Integration (shared environment)
    needs: plugins
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-phpunit.yml@b107001cce9f2960495d9d50481c8540d228f60c
    with:
      project-path: '.'
      php-version: '8.5'
      wp-version: ${{ needs.plugins.outputs.newest-wordpress }}
      composer-script: 'test:integration:ci'
      wp-env-config-file: '.wp-env.tests.json'

  shared-e2e:
    name: E2E (shared environment)
    needs: plugins
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-playwright-e2e.yml@b107001cce9f2960495d9d50481c8540d228f60c
    with:
      project-path: '.'
      artifact-slug: shared-environment
      php-version: '8.5'
      wp-version: ${{ needs.plugins.outputs.newest-wordpress }}
      build-script: 'setup:ci'
      wp-env-config-file: '.wp-env.tests.json'
