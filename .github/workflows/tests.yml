name: Tests

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugins:
    name: Plugins
    uses: ./.github/workflows/plugins.yml

  unit:
    name: Unit (${{ matrix.plugin }})
    needs: plugins
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.plugins.outputs.plugins) }}
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-phpunit.yml@8d53efd292e4abee4a9c57b0e379434f54bedbe9
    with:
      project-path: plugins/${{ matrix.plugin }}
      php-version: '8.5'
      composer-script: 'test:unit'
      needs-wp-env: false

  integration:
    name: Integration (${{ matrix.plugin }}, WordPress ${{ matrix.wp }})
    needs: plugins
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plugins.outputs.wordpress) }}
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-phpunit.yml@8d53efd292e4abee4a9c57b0e379434f54bedbe9
    with:
      project-path: plugins/${{ matrix.plugin }}
      php-version: '8.5'
      wp-version: ${{ matrix.wp }}
      composer-script: 'test:integration:run'
      wp-env-config-file: '.wp-env.tests.json'

  e2e:
    name: E2E (${{ matrix.plugin }}, WordPress ${{ matrix.wp }})
    needs: plugins
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plugins.outputs.wordpress) }}
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-playwright-e2e.yml@8d53efd292e4abee4a9c57b0e379434f54bedbe9
    with:
      project-path: plugins/${{ matrix.plugin }}
      artifact-slug: ${{ matrix.plugin }}-wp-${{ matrix.wp }}
      php-version: '8.5'
      wp-version: ${{ matrix.wp }}
      wp-env-config-file: '.wp-env.tests.json'
