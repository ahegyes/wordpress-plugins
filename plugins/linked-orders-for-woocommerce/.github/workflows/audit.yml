name: Supply-Chain Audit

on:
  push:
    branches: [trunk]
  pull_request:
  schedule:
    # Weekly, so advisories published against an unchanged lock surface without a push.
    - cron: '0 7 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  audit:
    name: Audit
    # Only production npm packages gate the audit, since a release ships none of the development tooling.
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-supply-chain-audit.yml@b107001cce9f2960495d9d50481c8540d228f60c
